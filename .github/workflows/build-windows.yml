name: Build Windows application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Build AppShelf with .NET Framework
        shell: cmd
        run: Build-AppShelf.cmd --no-start --no-pause

      - name: Verify executable
        shell: pwsh
        run: |
          $executable = Get-Item -LiteralPath "AppShelf.exe" -ErrorAction Stop
          if ($executable.Length -le 0) {
            throw "AppShelf.exe is empty."
          }

      - name: Test plugin package storage (Windows PowerShell 5.1 STA)
        shell: pwsh
        run: |
          $exe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $exe -NoProfile -STA -ExecutionPolicy Bypass -File tests\PluginPackages.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Plugin package regression failed" }

      - name: Upload Windows application
        uses: actions/upload-artifact@v6
        with:
          name: AppShelf-${{ github.sha }}
          path: AppShelf.exe
          if-no-files-found: error
          retention-days: 14
